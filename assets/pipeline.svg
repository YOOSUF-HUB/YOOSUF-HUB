<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img"><title>Agent pipeline: a user query goes to an LLM planner, which retrieves context with FAISS and calls MCP tools, then a grounded LLM writes the answer with sources.</title><style>text{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B98A4;white-space:pre}.p{fill:#E6EDF2}.m{fill:#52606B}.a{fill:#58A6FF}.w{font-weight:600}.s{font-family:Geist,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:bl 1.1s steps(1,end) infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}.blf{animation:blf 1.1s steps(1,end) infinite}@keyframes fl{0%,100%{opacity:.35}50%{opacity:1}}.fl{animation:fl 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bl,.blf,.pu,.fl{animation:none}}</style><rect width="880" height="230" fill="#03080D"/><rect width="880" height="28" fill="#08111A"/><line x1="0" y1="27.5" x2="880" y2="27.5" stroke="#16232D"/><text x="12" y="19" font-size="12" class="p w" xml:space="preserve">agent.pipeline</text><text x="868" y="19" font-size="12" class="m" text-anchor="end" xml:space="preserve">how I build agents</text><defs><pattern id="pg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#16232D"/></pattern><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#52606B"/></marker></defs><rect y="28" width="880" height="162" fill="url(#pg)"/><path d="M140 109H178" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><path d="M330 109H355V70H378" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><path d="M330 109H355V148H378" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><path d="M530 70H555V109H578" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><path d="M530 148H555V109H578" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><path d="M730 109H768" fill="none" stroke="#52606B" stroke-width="1.2" marker-end="url(#ah)"/><circle r="3.5" fill="#58A6FF" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M140 109H355V70H555V109H770"/></circle><circle r="3.5" fill="#58A6FF" opacity="0"><set attributeName="opacity" to="1" begin="2s"/><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M140 109H355V148H555V109H770"/></circle><rect x="20" y="83" width="120" height="52" fill="#0A141C" stroke="#16232D"/><text x="32" y="105" font-size="12" class="p w" xml:space="preserve">query</text><text x="32" y="123" font-size="10" class="m" xml:space="preserve">user</text><rect x="180" y="83" width="150" height="52" fill="#0A141C" stroke="#58A6FF"/><text x="192" y="105" font-size="12" class="a w" xml:space="preserve">planner</text><text x="192" y="123" font-size="10" class="m" xml:space="preserve">LLM · LangGraph</text><rect x="380" y="44" width="150" height="52" fill="#0A141C" stroke="#16232D"/><text x="392" y="66" font-size="12" class="p w" xml:space="preserve">retriever</text><text x="392" y="84" font-size="10" class="m" xml:space="preserve">FAISS · embeddings</text><rect x="380" y="122" width="150" height="52" fill="#0A141C" stroke="#16232D"/><text x="392" y="144" font-size="12" class="p w" xml:space="preserve">tools</text><text x="392" y="162" font-size="10" class="m" xml:space="preserve">MCP · APIs · SQL</text><rect x="580" y="83" width="150" height="52" fill="#0A141C" stroke="#16232D"/><text x="592" y="105" font-size="12" class="p w" xml:space="preserve">synthesizer</text><text x="592" y="123" font-size="10" class="m" xml:space="preserve">grounded LLM</text><rect x="770" y="83" width="90" height="52" fill="#0A141C" str