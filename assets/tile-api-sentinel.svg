<svg xmlns="http://www.w3.org/2000/svg" width="440" height="307" viewBox="0 0 440 307" role="img"><title>API Sentinel AI: agentic RAG that reviews API documentation for security and production readiness</title><style>text{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B98A4;white-space:pre}.p{fill:#E6EDF2}.m{fill:#52606B}.a{fill:#58A6FF}.w{font-weight:600}.s{font-family:Geist,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:bl 1.1s steps(1,end) infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}.blf{animation:blf 1.1s steps(1,end) infinite}@keyframes fl{0%,100%{opacity:.35}50%{opacity:1}}.fl{animation:fl 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bl,.blf,.pu,.fl{animation:none}}</style><rect width="440" height="307" fill="#03080D"/><rect width="440" height="28" fill="#08111A"/><line x1="0" y1="27.5" x2="440" y2="27.5" stroke="#16232D"/><rect x="8" y="6" width="16" height="16" fill="#0D1E33"/><text x="16" y="18" font-size="12" class="a w" text-anchor="middle" xml:space="preserve">2</text><text x="32" y="18" font-size="12" class="p w" xml:space="preserve">api-sentinel-ai</text><text x="428" y="18" font-size="12" class="m" text-anchor="end" xml:space="preserve">api-sentinel-ai.vercel.app</text><svg x="0" y="28" width="440" height="231" viewBox="0 0 440 231" overflow="hidden"><defs><pattern id="dg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#16232D"/></pattern></defs><rect width="440" height="231" fill="url(#dg)"/><rect x="18" y="18" width="236" height="160" fill="#0A141C" stroke="#16232D"/><text x="26" y="38" font-size="9" class="m" xml:space="preserve" style="opacity:.6">1</text><text x="42" y="38" font-size="11" xml:space="preserve"><tspan fill="#E6EDF2">POST /v1/payments</tspan></text><text x="26" y="56" font-size="9" class="m" xml:space="preserve" style="opacity:.6">2</text><text x="42" y="56" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">  auth: none</tspan></text><rect class="fl" x="244" y="47" width="4" height="11" fill="#58A6FF" style="animation-delay:0.3s"/><text x="26" y="74" font-size="9" class="m" xml:space="preserve" style="opacity:.6">3</text><text x="42" y="74" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">  rate_limit: —</tspan></text><rect class="fl" x="244" y="65" width="4" height="11" fill="#58A6FF" style="animation-delay:0.6s"/><text x="26" y="92" font-size="9" class="m" xml:space="preserve" style="opacity:.6">4</text><text x="42" y="92" font-size="11" xml:space="preserve"><tspan fill="#E6EDF2">GET  /v1/users/{id}</tspan></text><text x="26" y="110" font-size="9" class="m" xml:space="preserve" style="opacity:.6">5</text><text x="42" y="110" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">  returns: email, ssn</tspan></text><rect class="fl" x="244" y="101" width="4" height="11" fill="#58A6FF" style="animation-delay:1.2s"/><text x="26" y="128" font-size="9" class="m" xml:space="preserve" style="opacity:.6">6</text><text x="42" y="128" font-size="11" xml:space="preserve"><tspan fill="#8B98A4">  errors: 500 only</tspan></text><text x="26" y="146" font-size="9" class="m" xml:space="preserve" style="opacity:.6">7</text><text x="42" y="146" font-size="11" xml:space="preserve"><tspan fill="#E6EDF2">DELETE /v1/users/{id}</tspan></text><text x="26" y="164" font-size="9" class="m" xml:space="preserve" style="opacity:.6">8</text><text x="42" y="164" font-size="11" xml:space="preserve"><tspan fill="#8B98A4">  idempotent: yes</tspan></text><rect x="270" y="18" width="152" height="46" fill="#0A141C" stroke="#58A6FF"/><text x="282" y="36" font-size="10" class="m" xml:space="preserve">security</text><text x="282" y="54" font-size="13" class="a w" xml:space="preserve">2 high</text><rect x="270" y="74" width="152" height="46" fill="#0A141C" stroke="#16232D"/><text x="282" y="92" font-size="10" class="m" xml:space="preserve">quality</text><text x="282" y="110" font-size="13" class="p w" xml:space="preserve">1 warn</text><rect x="270" y="130" width="152" height="46" fill="#0A141C" stroke="#16232D"/><text x="282" y="148" font-size="10" class="m" xml:space="preserve">prod-ready</text><text x="282" y="166" font-size="13" class="p w" xml:space="preserve">no</text><text x="18" y="210" font-size="11" class="m" xml:space="preserve">ask it what a senior reviewer would</text><text x="422" y="210" font-size="11" class="a" text-anchor="end" xml:space="preserve">agentic RAG</text></svg><line x1="0" y1="259.5" x2="440" y2="259.5" stroke="#16232D"/><text x="16" y="288" font-size="13" class="p" xml:space="preserve">Reviews API docs like a senior</text><text x="424" y="288" font-size="12" class="m" text-anchor="end" xml:space="preserve">javascript</text><rect x=".5" y=".5" width="439" height="306" fill="none" stroke="#16232D"/></svg>