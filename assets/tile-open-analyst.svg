<svg xmlns="http://www.w3.org/2000/svg" width="880" height="307" viewBox="0 0 880 307" role="img"><title>Open Analyst: open-source AI data analyst that turns raw data into statistics, charts and plain-language insights through conversation</title><style>text{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B98A4;white-space:pre}.p{fill:#E6EDF2}.m{fill:#52606B}.a{fill:#58A6FF}.w{font-weight:600}.s{font-family:Geist,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:bl 1.1s steps(1,end) infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}.blf{animation:blf 1.1s steps(1,end) infinite}@keyframes fl{0%,100%{opacity:.35}50%{opacity:1}}.fl{animation:fl 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bl,.blf,.pu,.fl{animation:none}}</style><rect width="880" height="307" fill="#03080D"/><rect width="880" height="28" fill="#08111A"/><line x1="0" y1="27.5" x2="880" y2="27.5" stroke="#16232D"/><rect x="8" y="6" width="16" height="16" fill="#0D1E33"/><text x="16" y="18" font-size="12" class="a w" text-anchor="middle" xml:space="preserve">★</text><text x="32" y="18" font-size="12" class="p w" xml:space="preserve">open-analyst</text><text x="868" y="18" font-size="12" class="m" text-anchor="end" xml:space="preserve">open source · apache-2.0</text><svg x="0" y="28" width="880" height="231" viewBox="0 0 880 231" overflow="hidden"><defs><pattern id="dg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#16232D"/></pattern></defs><rect width="880" height="231" fill="url(#dg)"/><rect x="18" y="18" width="290" height="160" fill="#0A141C" stroke="#16232D"/><text x="30" y="40" font-size="10" class="m" xml:space="preserve">you</text><text x="30" y="58" font-size="12" class="p" xml:space="preserve">which region grew fastest</text><text x="30" y="74" font-size="12" class="p" xml:space="preserve">last quarter?</text><text x="30" y="102" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">▸ </tspan><tspan fill="#58A6FF">load    </tspan><tspan fill="#E6EDF2">sales.csv</tspan></text><text x="296" y="102" font-size="10" class="m" text-anchor="end" xml:space="preserve">12,480 rows</text><text x="30" y="121" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">▸ </tspan><tspan fill="#58A6FF">group   </tspan><tspan fill="#E6EDF2">region, quarter</tspan></text><text x="296" y="121" font-size="10" class="m" text-anchor="end" xml:space="preserve">4 × 2</text><text x="30" y="140" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">▸ </tspan><tspan fill="#58A6FF">compute </tspan><tspan fill="#E6EDF2">pct_change()</tspan></text><text x="296" y="140" font-size="10" class="m" text-anchor="end" xml:space="preserve">exact</text><text x="30" y="159" font-size="11" xml:space="preserve"><tspan fill="#58A6FF">▸ </tspan><tspan fill="#58A6FF">plot    </tspan><tspan fill="#E6EDF2">bar chart</tspan></text><text x="296" y="159" font-size="10" class="m" text-anchor="end" xml:space="preserve">done</text><rect x="326" y="18" width="290" height="160" fill="#0A141C" stroke="#16232D"/><text x="338" y="40" font-size="10" class="m" xml:space="preserve">QoQ revenue growth</text><line x1="412.5" y1="52" x2="412.5" y2="166" stroke="#16232D"/><text x="338" y="71" font-size="11" class="p" xml:space="preserve">north</text><rect x="412" y="60" width="144" height="14" fill="#58A6FF"/><text x="564" y="71" font-size="11" class="a w" xml:space="preserve">+18%</text><text x="338" y="98" font-size="11" xml:space="preserve">west</text><rect x="412" y="87" width="88" height="14" fill="#52606B"/><text x="508" y="98" font-size="11" class="m" xml:space="preserve">+11%</text><text x="338" y="125" font-size="11" xml:space="preserve">east</text><rect x="412" y="114" width="48" height="14" fill="#52606B"/><text x="468" y="125" font-size="11" class="m" xml:space="preserve">+6%</text><text x="338" y="152" font-size="11" xml:space="preserve">south</text><rect x="388" y="141" width="24" height="14" fill="#52606B"/><text x="420" y="152" font-size="11" class="m" xml:space="preserve">-3%</text><rect x="634" y="18" width="228" height="160" fill="#0A141C" stroke="#58A6FF"/><text x="646" y="40" font-size="10" class="m" xml:space="preserve">INSIGHT</text><text x="646" y="76" font-size="30" class="a s" xml:space="preserve" style="font-weight:300">+18%</text><text x="646" y="102" font-size="12" class="p" xml:space="preserve">north grew fastest</text><text x="646" y="120" font-size="12" class="p" xml:space="preserve">quarter over quarter</text><text x="646" y="160" font-size="10" class="m" xml:space="preserve">numbers: pandas</text><text x="646" y="172" font-size="10" class="m" xml:space="preserve">words: the LLM</text><text x="18" y="210" font-size="11" class="m" xml:space="preserve">upload data, ask in plain words: stats, charts and insight, no code</text><text x="862" y="210" font-size="11" class="a" text-anchor="end" xml:space="preserve">FastAPI · React · Postgres</text></svg><line x1="0" y1="259.5" x2="880" y2="259.5" stroke="#16232D"/><text x="16" y="288" font-size="13" class="p" xml:space="preserve">Open-source AI data analyst</text><text x="864" y="288" font-size="12" class="m" text-anchor="end" xml:space="preserve">python · typescript</text><rect x=".5" y=".5" width="879" height="306" fill="none" stroke="#16232D"/></svg>