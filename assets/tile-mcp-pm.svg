<svg xmlns="http://www.w3.org/2000/svg" width="440" height="307" viewBox="0 0 440 307" role="img"><title>AI Project Manager MCP Server: connects Claude Desktop to a SQLite project database through safe tools</title><style>text{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B98A4;white-space:pre}.p{fill:#E6EDF2}.m{fill:#52606B}.a{fill:#58A6FF}.w{font-weight:600}.s{font-family:Geist,Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:bl 1.1s steps(1,end) infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.25}}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}.blf{animation:blf 1.1s steps(1,end) infinite}@keyframes fl{0%,100%{opacity:.35}50%{opacity:1}}.fl{animation:fl 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bl,.blf,.pu,.fl{animation:none}}</style><rect width="440" height="307" fill="#03080D"/><rect width="440" height="28" fill="#08111A"/><line x1="0" y1="27.5" x2="440" y2="27.5" stroke="#16232D"/><rect x="8" y="6" width="16" height="16" fill="#0D1E33"/><text x="16" y="18" font-size="12" class="a w" text-anchor="middle" xml:space="preserve">3</text><text x="32" y="18" font-size="12" class="p w" xml:space="preserve">ai-project-manager-mcp</text><text x="428" y="18" font-size="12" class="m" text-anchor="end" xml:space="preserve">model context protocol</text><svg x="0" y="28" width="440" height="231" viewBox="0 0 440 231" overflow="hidden"><defs><pattern id="dg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#16232D"/></pattern></defs><rect width="440" height="231" fill="url(#dg)"/><rect x="18" y="18" width="404" height="66" fill="#0A141C" stroke="#16232D"/><text x="30" y="40" font-size="11" xml:space="preserve"><tspan fill="#52606B">&gt; </tspan><tspan fill="#E6EDF2">Generate a sprint risk report.</tspan></text><text x="30" y="62" font-size="11" xml:space="preserve"><tspan fill="#52606B">tool </tspan><tspan fill="#58A6FF">generate_sprint_risk_report</tspan><tspan fill="#E6EDF2">()</tspan><tspan fill="#58A6FF"> ▌</tspan></text><rect x="18" y="104" width="120" height="54" fill="#0A141C" stroke="#16232D"/><text x="30" y="126" font-size="12" class="p w" xml:space="preserve">Claude</text><text x="30" y="146" font-size="10" class="m" xml:space="preserve">desktop</text><text x="149" y="136" font-size="13" class="m" text-anchor="middle" xml:space="preserve">⇄</text><rect x="160" y="104" width="120" height="54" fill="#0A141C" stroke="#58A6FF"/><text x="172" y="126" font-size="12" class="a w" xml:space="preserve">MCP server</text><text x="172" y="146" font-size="10" class="m" xml:space="preserve">python</text><text x="291" y="136" font-size="13" class="m" text-anchor="middle" xml:space="preserve">⇄</text><rect x="302" y="104" width="120" height="54" fill="#0A141C" stroke="#16232D"/><text x="314" y="126" font-size="12" class="p w" xml:space="preserve">SQLite</text><text x="314" y="146" font-size="10" class="m" xml:space="preserve">tasks, risks</text><text x="18" y="182" font-size="10" class="m" xml:space="preserve">audit_log  +1 row</text><text x="18" y="210" font-size="11" class="m" xml:space="preserve">safe, predefined tools, not raw SQL</text><text x="422" y="210" font-size="11" class="a" text-anchor="end" xml:space="preserve">MCP</text></svg><line x1="0" y1="259.5" x2="440" y2="259.5" stroke="#16232D"/><text x="16" y="288" font-size="13" class="p" xml:space="preserve">Claude meets a real PM database</text><text x="424" y="288" font-size="12" class="m" text-anchor="end" xml:space="preserve">python</text><rect x=".5" y=".5" width="439" height="306" fill="none" stroke="#16232D"/></svg>